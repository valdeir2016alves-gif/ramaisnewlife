version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ramais-new-life
    restart: unless-stopped
    ports:
      - "3000:3000"
    # IMPORTANTE SOBRE O BANCO DE DADOS:
    # Como o SQLite salva os dados em um arquivo local (ramais.db), ao reiniciar 
    # o container do zero, os novos ramais adicionados poderiam ser perdidos.
    # 
    # Para persistir os dados no servidor hospedeiro, recomendamos mapear um volume.
    # Exemplo:
    # volumes:
    #   - ./dados-db:/app/data
    # (Se fizer isso, lembre-se de alterar o caminho em lib/db.ts para 'data/ramais.db' 
    #  e mover seu ramais.db original para essa pasta).
