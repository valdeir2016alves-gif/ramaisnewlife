

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ramais-new-life
    restart: unless-stopped
    ports:
      - "3000:3000"
    # IMPORTANTE: Usamos um Docker Named Volume (ramais_data) para armazenar os dados.
    # Isso garante que o banco de dados seja salvo permanentemente sem causar
    # erros de "Segmentation Fault" (código 139) que ocorrem ao usar pastas do Windows.
    volumes:
      - ramais_data:/app/data

volumes:
  ramais_data:
